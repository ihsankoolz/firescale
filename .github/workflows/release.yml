# Builds the npm tarballs for all six platforms. For a version tag it then
# publishes the eight packages to npm and checks the result from clean runners.
#
#   started by hand (workflow_dispatch)   builds the tarballs, publishes nothing
#   push of a tag v<version>              builds, publishes, verifies
#
# Publishing uses npm trusted publishing (OIDC): there is no npm token and no
# secret in this file. Each package names this workflow file, release.yml, as
# its trusted publisher on npmjs.com. Renaming the file breaks publishing.
# RELEASING.md has the owner's steps; ADR 0021 has the reasons.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Two runs for one tag never publish at the same time. A run in progress is
# never cancelled: a publish that is cut off is finished by running it again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The default for every job. Only the publish job asks for more.
permissions:
  contents: read

jobs:
  version:
    # Fails early, before any build minutes are spent, when the version is not
    # the same in Cargo.toml, Cargo.lock and every package.json, or when the
    # tag is not v<that version>.
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      # Actions are pinned to commit SHAs. The comment is the tag the SHA belongs to (ADR 0009).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Version is the same everywhere
        if: github.ref_type != 'tag'
        run: node scripts/bump-version.mjs --check

      - name: Version is the same everywhere and matches the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/bump-version.mjs --check --tag "$TAG"

      - name: Read the version
        id: read
        run: echo "version=$(node scripts/bump-version.mjs --check)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build / ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            ext: ''
            cross: false
          - key: linux-arm64
            os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            ext: ''
            cross: false
          - key: darwin-arm64
            os: macos-latest
            triple: aarch64-apple-darwin
            ext: ''
            cross: false
          - key: darwin-x64
            os: macos-latest
            triple: x86_64-apple-darwin
            ext: ''
            cross: true
          - key: win32-x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
            cross: false
          - key: win32-arm64
            os: windows-latest
            triple: aarch64-pc-windows-msvc
            ext: .exe
            cross: true
    steps:
      # Actions are pinned to commit SHAs. The comment is the tag the SHA belongs to (ADR 0009).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        run: rustup toolchain install

      - name: Add cross-compile target
        if: ${{ matrix.cross }}
        run: rustup target add ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - name: Build release binary
        run: cargo build --release -p firescale-cli --target ${{ matrix.triple }}

      - name: Pack npm tarballs
        run: node scripts/pack-npm.mjs --binary target/${{ matrix.triple }}/release/fscale${{ matrix.ext }} --platform ${{ matrix.key }} --out dist-npm

      # Cross-compiled binaries cannot run on the build machine, so they are not smoke tested.
      - name: Install smoke test (npm)
        if: ${{ !matrix.cross }}
        run: node scripts/smoke-npm.mjs --pm npm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.key }}
          path: |
            dist-npm/*.tgz
            dist-npm/manifest.json
          if-no-files-found: error

  publish:
    # Only for a pushed version tag. A run started by hand stops after the build.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, build]
    name: publish to npm
    # Trusted publishing works on GitHub-hosted runners only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm exchange a short-lived GitHub OIDC token for the right to
      # publish. This is the whole credential: there is no npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted publishing needs npm 11.5.1 or later and Node 22.14.0 or later.
      # Node 24 ships a new enough npm; the publish script checks both.
      # No cache: a release never restores files from an earlier run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: npm-*

      # Platform packages, then @firescale/sdk, then firescale. A version that
      # is already on the registry is skipped, so this job can be run again.
      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/publish-npm.mjs --dir artifacts --version "$VERSION"

  verify:
    needs: [version, publish]
    name: verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Only the script is used from the checkout. It runs npx in an empty
      # temp folder with an empty npm cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # A new version can take a few minutes to become installable: up to
      # 20 attempts, 15 seconds apart.
      - name: npx firescale@<version> --version
        # bash on every OS, so the variable is read the same way.
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/verify-published.mjs "$VERSION"
