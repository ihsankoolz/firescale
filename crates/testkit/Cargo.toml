[package]
name = "firescale-testkit"
description = "Test-only helpers for firescale. Not shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# A stand-in for `node` that records that it was started. Used to prove that
# fscale does not start Node for repos with only built-in rules.
[[bin]]
name = "fscale-node-stub"
path = "src/node_stub.rs"

# A stand-in for a virtual environment's `python`. Used to prove that verify
# runs a Python project's steps with the interpreter in its .venv.
[[bin]]
name = "fscale-python-stub"
path = "src/python_stub.rs"

# A process tree that records its process ids. Used to prove that verify
# stops every process a command started, on a timeout and on Ctrl+C.
[[bin]]
name = "fscale-tree-stub"
path = "src/tree_stub.rs"

# Sends Ctrl+Break to fscale on Windows, as a console does.
[[bin]]
name = "fscale-ctrl-break"
path = "src/ctrl_break.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[lints]
workspace = true
