name: CI

# What runs when (ADR 0016, ADR 0066):
#   push to any branch         Linux, Node 22 and 24
#   pull request into main     macOS and Windows, Node 24 (Linux comes from the push)
#   started by hand            all of the above, plus the benchmark and npm package jobs
# A push or pull request that changes only docs runs none of the test jobs,
# only the `docs only` job (see the `changes` job). Started by hand, all run.
on:
  push:
    # Branches only: a version tag starts the Release workflow, not this one.
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch, or to a pull request, cancels the run still in
# progress for it. Push runs and pull request runs are separate groups, so
# they never cancel each other. Each push to main has a group of its own (its
# run id), so its run is never cancelled, nor dropped while queued: the
# `changes` job compares a push to main with the commit before it, and a
# docs-only merge must not cancel the Linux run of the code merge before it
# (ADR 0066).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Decides from the changed files whether the test jobs run (ADR 0066).
    # The jobs below are skipped with `if:`, not left out with a `paths`
    # filter on the workflow: a skipped job is reported as a passed check,
    # while a check that a filter keeps from running is never reported, and a
    # required one would wait forever.
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      # Actions are pinned to commit SHAs. The comment is the tag the SHA belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the commit to compare with is in the clone.
          fetch-depth: 0

      - name: Changed files
        id: files
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Only documentation, read by no build and no test: a .md file
          # under docs/ or at the root. Narrow on purpose: docs/rules.md is
          # read by a Rust test, docs/schemas by a Vitest test, README.md and
          # AGENTS.md by the rules `fscale check` runs on this repo (in any
          # case: core/readme-setup finds readme.md too), and nothing under
          # crates/ or packages/ counts (each rule's SKILL.md is compiled
          # into the binary).
          docs_only() {
            case "$1" in
              docs/rules.md | docs/schemas/*) return 1 ;;
              docs/*.md) return 0 ;;
              */*) return 1 ;;
            esac
            case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
              readme.md | agents.md | claude.md) return 1 ;;
            esac
            case "$1" in
              *.md) return 0 ;;
            esac
            return 1
          }
          everything() {
            echo "Every job runs: $1."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT" in
            pull_request)
              # The merge commit's first parent is the tip of the base branch.
              base=$(git rev-parse --verify --quiet 'HEAD^1') || everything "the merge commit has no parent"
              ;;
            push)
              if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                # What this push added to the default branch.
                base=$BEFORE
              else
                # The whole branch, not only this push: a docs-only push after
                # a code push must not report the branch as tested.
                base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD) || everything "the branch has no merge base with $DEFAULT_BRANCH"
              fi
              ;;
            *)
              everything "the run was started by $EVENT"
              ;;
          esac
          git cat-file -e "$base^{commit}" 2>/dev/null || everything "the commit to compare with ($base) is not in the clone"

          # --no-renames lists both paths of a rename.
          git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed" || everything "git diff failed"
          count=0
          code=false
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if docs_only "$file"; then
              echo "docs  $file"
            else
              echo "code  $file"
              code=true
            fi
          done < "$RUNNER_TEMP/changed"
          [ "$count" -gt 0 ] || everything "no file changed since $base"
          if [ "$code" = true ]; then
            echo "Every job runs: $count files changed since $base, not only docs."
          else
            echo "Only docs changed since $base ($count files): the test jobs are skipped."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Four test jobs with the same steps, each with its own name, so that a
  # job skipped because the change is only docs is reported under the same
  # check name as a job that ran. A skipped matrix job is not: GitHub reports
  # it once, under its unexpanded name (`ubuntu-latest / node ${{ matrix.node }}`).
  # A job skipped because of the event (macOS and Windows on a push, Linux on
  # a pull request from this repository) gets another name, so that its
  # skipped check never shares a name with the real one on the same commit. The steps are written out
  # in each job, not shared through a YAML anchor, because firescale's tamper
  # guard does not read anchors and would no longer see these commands. Keep
  # the four lists identical; only NODE_VERSION differs.
  # Each test job runs unless the change is only docs. If the `changes` job
  # failed, its output is empty and they run.
  linux-22:
    # Every push, and manual runs. A pull request from this repository already
    # has a push run for the same commit, so only pull requests from forks,
    # whose pushes do not run here, get Linux from the pull request event.
    # Linux covers both supported Node versions.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'ubuntu node 22 (runs in the push run)' || 'ubuntu-latest / node 22' }}
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Also restores and saves the pnpm store cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # Restores and saves the cargo registry and the target folder. The key
      # names the OS group, as the job ids `linux` and `desktop` did before
      # ADR 0066, so the caches saved before are still found.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os == 'Linux' && 'linux' || 'desktop' }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The checkout is on D:, the runner's work drive, but the temp folder is
      # on C:, the slower system drive. The tests write their fixture repos,
      # verify's base runs and Rust's temp files there (ADR 0066).
      - name: Temp folder on the work drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Test
        run: pnpm test

      - name: Smoke test
        run: pnpm fscale --version

  linux-24:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'ubuntu node 24 (runs in the push run)' || 'ubuntu-latest / node 24' }}
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24
    # The same steps as the linux-22 job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Also restores and saves the pnpm store cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # Restores and saves the cargo registry and the target folder. The key
      # names the OS group, as the job ids `linux` and `desktop` did before
      # ADR 0066, so the caches saved before are still found.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os == 'Linux' && 'linux' || 'desktop' }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The checkout is on D:, the runner's work drive, but the temp folder is
      # on C:, the slower system drive. The tests write their fixture repos,
      # verify's base runs and Rust's temp files there (ADR 0066).
      - name: Temp folder on the work drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Test
        run: pnpm test

      - name: Smoke test
        run: pnpm fscale --version

  # macOS and Windows minutes cost more than Linux ones, so these run only for
  # pull requests into main and for manual runs, on one Node version.
  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'push' }}
    name: ${{ github.event_name == 'push' && 'macos node 24 (pull requests only)' || 'macos-latest / node 24' }}
    runs-on: macos-latest
    env:
      NODE_VERSION: 24
    # The same steps as the linux-22 job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Also restores and saves the pnpm store cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # Restores and saves the cargo registry and the target folder. The key
      # names the OS group, as the job ids `linux` and `desktop` did before
      # ADR 0066, so the caches saved before are still found.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os == 'Linux' && 'linux' || 'desktop' }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The checkout is on D:, the runner's work drive, but the temp folder is
      # on C:, the slower system drive. The tests write their fixture repos,
      # verify's base runs and Rust's temp files there (ADR 0066).
      - name: Temp folder on the work drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Test
        run: pnpm test

      - name: Smoke test
        run: pnpm fscale --version

  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'push' }}
    name: ${{ github.event_name == 'push' && 'windows node 24 (pull requests only)' || 'windows-latest / node 24' }}
    runs-on: windows-latest
    env:
      NODE_VERSION: 24
    # The same steps as the linux-22 job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Also restores and saves the pnpm store cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # Restores and saves the cargo registry and the target folder. The key
      # names the OS group, as the job ids `linux` and `desktop` did before
      # ADR 0066, so the caches saved before are still found.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os == 'Linux' && 'linux' || 'desktop' }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The checkout is on D:, the runner's work drive, but the temp folder is
      # on C:, the slower system drive. The tests write their fixture repos,
      # verify's base runs and Rust's temp files there (ADR 0066).
      - name: Temp folder on the work drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Test
        run: pnpm test

      - name: Smoke test
        run: pnpm fscale --version

  docs:
    # A change of docs only still gets the two checks that read those files:
    # Prettier, and `fscale check` on this repo (core-pack.test.ts runs the
    # same check; core/no-secrets-in-source reads every file). On Linux, from
    # the push, like the linux jobs.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'docs (runs in the push run)' || 'docs only' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        run: rustup toolchain install

      # The linux jobs' cache, restored only: this job builds one crate.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint:format

      # What core-pack.test.ts asserts on this repo: `fscale check` passes
      # with no violation at all. Its exit code is not enough: this repo
      # enforces no rule, so a report-only violation still exits 0.
      - name: Check this repo with fscale, no violation at all
        run: |
          pnpm --silent fscale check --json > "$RUNNER_TEMP/check.json"
          violations=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).summary.violations" "$RUNNER_TEMP/check.json")
          if [ "$violations" != 0 ]; then
            pnpm --silent fscale check
            echo "::error::fscale check reports $violations violation(s) in this repo. core-pack.test.ts requires none: fix them, or the next change that runs the tests fails."
            exit 1
          fi
          echo "fscale check: no violations."

  bench:
    # Costly, and rarely changes the answer. Runs only when the workflow is
    # started by hand.
    if: github.event_name == 'workflow_dispatch'
    name: bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bench scripts have no dependencies, so there is no pnpm install here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release -p firescale-cli

      - name: Generate fixture
        run: node bench/generate-fixture.mjs "${{ runner.temp }}/fixture-50k" --files 50000

      - name: Run benchmark
        run: node bench/check-bench.mjs --bin target/release/fscale --fixture "${{ runner.temp }}/fixture-50k" --runs 10 --label "${{ matrix.os }}" --files 50000

  package:
    # Costly, and it ends with a benchmark. Runs only when the workflow is
    # started by hand.
    if: github.event_name == 'workflow_dispatch'
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build release binary
        run: cargo build --release -p firescale-cli

      - name: Build packages
        run: pnpm -r run build

      - name: Pack npm tarballs
        run: node scripts/pack-npm.mjs

      - name: Install smoke test (npm)
        run: node scripts/smoke-npm.mjs --pm npm

      - name: Install smoke test (pnpm)
        run: node scripts/smoke-npm.mjs --pm pnpm

      - name: Install smoke test (yarn)
        run: node scripts/smoke-npm.mjs --pm yarn

      - name: Launcher startup benchmark
        run: node bench/launcher-bench.mjs
