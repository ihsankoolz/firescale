# cargo-deny's settings for this workspace (ADR 0093). The Release workflow
# runs `cargo deny check` before any build; a finding stops the release.
# Run it locally with `cargo deny check` (cargo-deny 0.22.1).

[graph]
# Every platform the release builds, so a dependency used only on Windows or
# macOS is checked too.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# Every vulnerability in the RustSec database fails, whatever its severity.
# A crate that is yanked from crates.io, or a direct dependency that RustSec
# marks unmaintained, fails too.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# The licenses the dependency tree uses today, all permissive. A dependency
# under any other license fails until it is reviewed and added here.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are reported, not refused.
multiple-versions = "warn"
# A dependency with the version "*" is refused; the workspace's own crates,
# which depend on each other by path, are not published to crates.io.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io: no other registry and no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
