[workspace]
resolver = "2"
members = ["crates/core", "crates/rules", "crates/cli", "crates/testkit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ihsankoolz/firescale"
rust-version = "1.85"

[workspace.dependencies]
firescale-core = { path = "crates/core" }
firescale-rules = { path = "crates/rules" }
serde = { version = "=1.0.229", features = ["derive"] }
# preserve_order: config keys are reported in the order the user wrote them.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tempfile = "=3.27.0"
ignore = "=0.4.34"
globset = "=0.4.21"
blake3 = "=1.8.7"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
strip = "symbols"
