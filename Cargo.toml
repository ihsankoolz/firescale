[workspace]
resolver = "2"
members = ["crates/core", "crates/rules", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ihsankoolz/firescale"
rust-version = "1.85"

[workspace.dependencies]
firescale-core = { path = "crates/core" }
firescale-rules = { path = "crates/rules" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
strip = "symbols"
