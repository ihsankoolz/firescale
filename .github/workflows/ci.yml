name: CI

# What runs when (ADR 0016):
#   push to any branch         Linux, Node 22 and 24
#   pull request into main     macOS and Windows, Node 24 (Linux comes from the push)
#   started by hand            all of the above, plus the benchmark and npm package jobs
on:
  push:
    # Branches only: a version tag starts the Release workflow, not this one.
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch, or to a pull request, cancels the run still in
# progress for it. Push runs and pull request runs are separate groups, so
# they never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    # Every push, and manual runs. A pull request from this repository already
    # has a push run for the same commit, so only pull requests from forks,
    # whose pushes do not run here, get Linux from the pull request event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: ubuntu-latest / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Linux covers both supported Node versions.
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to commit SHAs. The comment is the tag the SHA belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Also restores and saves the pnpm store cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # Restores and saves the cargo registry and the target folder.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Smoke test
        run: pnpm fscale --version

  desktop:
    # macOS and Windows minutes cost more than Linux ones, so these run only
    # for pull requests into main and for manual runs, on one Node version.
    if: github.event_name != 'push'
    name: ${{ matrix.os }} / node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same steps as the linux job. Keep the two lists identical.
      # Reads the pinned pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Also restores and saves the pnpm store cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # Restores and saves the cargo registry and the target folder.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Smoke test
        run: pnpm fscale --version

  bench:
    # Costly, and rarely changes the answer. Runs only when the workflow is
    # started by hand.
    if: github.event_name == 'workflow_dispatch'
    name: bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bench scripts have no dependencies, so there is no pnpm install here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release -p firescale-cli

      - name: Generate fixture
        run: node bench/generate-fixture.mjs "${{ runner.temp }}/fixture-50k" --files 50000

      - name: Run benchmark
        run: node bench/check-bench.mjs --bin target/release/fscale --fixture "${{ runner.temp }}/fixture-50k" --runs 10 --label "${{ matrix.os }}" --files 50000

  package:
    # Costly, and it ends with a benchmark. Runs only when the workflow is
    # started by hand.
    if: github.event_name == 'workflow_dispatch'
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build release binary
        run: cargo build --release -p firescale-cli

      - name: Build packages
        run: pnpm -r run build

      - name: Pack npm tarballs
        run: node scripts/pack-npm.mjs

      - name: Install smoke test (npm)
        run: node scripts/smoke-npm.mjs --pm npm

      - name: Install smoke test (pnpm)
        run: node scripts/smoke-npm.mjs --pm pnpm

      - name: Install smoke test (yarn)
        run: node scripts/smoke-npm.mjs --pm yarn

      - name: Launcher startup benchmark
        run: node bench/launcher-bench.mjs
